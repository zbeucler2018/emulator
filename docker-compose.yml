name: emulator

services:
  # Refuses to let the app start when the CIFS share or its marker is absent.
  # This is intentionally a one-shot dependency, not an optional health hint.
  mount-guard:
    # Alpine 3.22 image currently deployed; pinned by immutable digest.
    image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    restart: "no"
    environment:
      GAMES_MOUNT: ${GAMES_MOUNT:?set GAMES_MOUNT in .env}
      ROM_LIBRARY_PATH: ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}
      ROMM_ASSETS_PATH: ${ROMM_ASSETS_PATH:?set ROMM_ASSETS_PATH in .env}
      NAS_SERVER: ${NAS_SERVER:?set NAS_SERVER in .env}
      NAS_SHARE: ${NAS_SHARE:?set NAS_SHARE in .env}
      NAS_MARKER: ${NAS_MARKER:-.emulator-nas-marker}
    volumes:
      - ${GAMES_MOUNT:?set GAMES_MOUNT in .env}:${GAMES_MOUNT}:ro
      - ./scripts/mount-check.sh:/usr/local/bin/mount-check:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/mount-check"]

  romm-db:
    # MariaDB 11.8.9 image currently deployed; pinned by immutable digest.
    image: mariadb@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
    volumes:
      - ${APP_DATA_PATH:?set APP_DATA_PATH in .env}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  romm:
    # RomM 5.4.0 image, pinned by immutable digest.
    image: rommapp/romm@sha256:03295f95a6290e752641f9553ac4198b0e5b71b879d57f7b2371b98f608feb54
    restart: unless-stopped
    depends_on:
      mount-guard:
        condition: service_completed_successfully
      romm-db:
        condition: service_healthy
    environment:
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY:?set ROMM_AUTH_SECRET_KEY in .env}
      ROMM_BASE_URL: ${ROMM_BASE_URL:?set ROMM_BASE_URL in .env}
      HASHEOUS_API_ENABLED: "true"
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD:-}
      RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      STREAMING_BROKER_SECRET: ${STREAMING_BROKER_SECRET:?set STREAMING_BROKER_SECRET in .env}
      STREAMING_LAUNCH_TIMEOUT: ${STREAMING_LAUNCH_TIMEOUT:-600}
      STREAMING_SAVE_TIMEOUT: ${STREAMING_SAVE_TIMEOUT:-120}
      STREAMING_STATE_HISTORY_LIMIT: ${STREAMING_STATE_HISTORY_LIMIT:-50}
    volumes:
      # Keep the NAS share itself as the bind source, exposed at RomM's
      # built-in Structure A path: /romm/library/roms/{platform}/{game}.
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}:/romm/library/roms:ro
      # Test Skate 3 directly from the host's local Desktop copy. This nested,
      # read-only bind deliberately shadows only the matching NAS title path;
      # it never copies or writes game data to Sophia.
      - /home/service/Desktop/Skate3-local/Skate 3 [BLUS30464]:/romm/library/roms/PS3/disk_games/Skate 3 [BLUS30464]:ro
      - ${ROMM_ASSETS_PATH:?set ROMM_ASSETS_PATH in .env}:/romm/assets
      - ${APP_DATA_PATH:?set APP_DATA_PATH in .env}/resources:/romm/resources
      - ${APP_DATA_PATH:?set APP_DATA_PATH in .env}/redis:/redis-data
      - ./config:/romm/config:ro
    ports:
      # Only the local Tailscale Serve proxy may reach RomM; no LAN/public bind.
      - "127.0.0.1:${ROMM_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Native-emulator streaming for RomM. The container includes Selkies,
  # romm-broker, and the supported emulators; it is not a replacement for
  # RomM's existing EmulatorJS player.
  romm-webstation:
    # Thin local derivative of the pinned WebStation v0.15.1-ls40 image. It
    # adds Wine only; all emulator, Selkies and broker components remain the
    # upstream image versions recorded in the Dockerfile.
    image: emulator-webstation-infinity-blade:0.1.0
    build:
      context: .
      dockerfile: docker/webstation-infinity-blade.Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mount-guard:
        condition: service_completed_successfully
    environment:
      PUID: ${WEBSTATION_PUID:-1000}
      PGID: ${WEBSTATION_PGID:-1000}
      TZ: ${TZ:-America/New_York}
      SUBFOLDER: /streaming/
      BROKER_SECRET: ${STREAMING_BROKER_SECRET:?set STREAMING_BROKER_SECRET in .env}
      # Prometheus-compatible Selkies metrics remain behind the existing
      # token-authenticated /streaming/ Tailscale Serve route.
      SELKIES_ENABLE_METRICS_HTTP: "true"
      SELKIES_MASTER_TOKEN: ${SELKIES_MASTER_TOKEN:?set SELKIES_MASTER_TOKEN in .env}
      # Default to Selkies' WebSocket transport.  The WebRTC/NVENC path can
      # stay pinned to the all-black GOP captured while Wine replaces the
      # loading splash, even though the live Xwayland display is rendering.
      # WebSockets still uses the existing Selkies stream and NVIDIA encoder,
      # but reliably hands late game frames to desktop and mobile browsers.
      # Disable dual-mode selection so browsers that previously remembered
      # WebRTC automatically follow this server-side default.
      SELKIES_MODE: websockets
      SELKIES_ENABLE_DUAL_MODE: "false"
      # Stream every frame for games. Desktop paint-over mode can remain black
      # when a Wine game replaces the initially empty desktop; reconnecting a
      # browser forces a keyframe, but continuous video avoids that workaround.
      SELKIES_VIDEO_STREAMING_MODE: "true"
      # Mobile Safari can remain on the initial black GOP after Wine creates
      # the game window. Periodic recovery IDRs let an already-connected peer
      # acquire the live frame without closing and reopening the stream.
      SELKIES_KEYFRAME_INTERVAL: "2"
      # Infinity Blade rejects phone-sized virtual desktops (for example,
      # Mobile Safari resized the compositor to 390x668). Keep the streamed
      # desktop at a game-safe 16:9 resolution; Selkies scales that canvas to
      # each browser without changing Wine's display underneath it.
      SELKIES_MANUAL_RESOLUTION: "true"
      SELKIES_MANUAL_WIDTH: "1280"
      SELKIES_MANUAL_HEIGHT: "720"
      SELKIES_ENABLE_RESIZE: "false"
      SELKIES_WEBRTC_UDP_MUX_PORT: ${SELKIES_WEBRTC_UDP_MUX_PORT:-59000}
      SELKIES_WEBRTC_PUBLIC_IP: ${TAILSCALE_IPV4:?set TAILSCALE_IPV4 in .env}
      SELKIES_WEBRTC_ICE_LITE: "true"
      SELKIES_CONGESTION_CONTROL: "true"
      # Keep Skate 3's RPCS3 game-install cache out of its tiny save archive.
      ROMM_RPC3_SKATE3_SAVE_FILTER: "true"
      INFINITY_BLADE_ENABLED: "true"
      INFINITY_BLADE_WINEPREFIX: /config/infinity-blade/prefix
      INFINITY_BLADE_WINE_USER: abc
      PYTHONPATH: /opt/romm/overrides
      AUTO_GPU: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      # Keep xemu's mutable console configuration and HDD image in the
      # persistent Webstation volume, rather than an image-local default.
      XEMU_BIN: /opt/romm/bin/xemu-bios-wrapper.sh
      XEMU_TOML: /config/xemu/xemu.toml
      XEMU_HDD_IMAGE: /config/xemu/xbox_hdd.qcow2
      # The packaged Vulkan stack is incomplete in this WebStation image.
      # Use the host NVIDIA OpenGL path for broker-launched PCSX2 games.
      PCSX2_BIN: /opt/romm/bin/pcsx2-opengl-wrapper.sh
      # Route broker-launched Dolphin through a tiny persistence shim. The
      # shim keeps the shared Wii Mii database outside the per-game NAND tree
      # that webstation-broker clears before every restore.
      DOLPHIN_BIN: /opt/romm/bin/dolphin-mii-wrapper.sh
    volumes:
      # Persist emulator configuration, firmware, save staging and broker data.
      - ${WEBSTATION_CONFIG_PATH:?set WEBSTATION_CONFIG_PATH in .env}:/config
      # Real Wii Remotes: forwarded USB Bluetooth adapters may reconnect on a new bus.
      - /dev/bus/usb:/dev/bus/usb
      # Match RomM's existing library path exactly. Game data remains read-only.
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}:/romm/library/roms:ro
      # Match RomM's local Skate 3 test source so the broker launches the
      # Desktop copy without moving it into the Sophia library.
      - /home/service/Desktop/Skate3-local/Skate 3 [BLUS30464]:/romm/library/roms/PS3/disk_games/Skate 3 [BLUS30464]:ro
      # Xbox firmware is kept outside the scanned game library and is read-only
      # in WebStation. Xemu's writable HDD remains under /config.
      - ${XEMU_FIRMWARE_PATH:?set XEMU_FIRMWARE_PATH in .env}:/xemu-firmware:ro
      - ./scripts/xemu-bios-wrapper.sh:/opt/romm/bin/xemu-bios-wrapper.sh:ro
      - ./scripts/pcsx2-opengl-wrapper.sh:/opt/romm/bin/pcsx2-opengl-wrapper.sh:ro
      - ./scripts/dolphin-mii-wrapper.sh:/opt/romm/bin/dolphin-mii-wrapper.sh:ro
      - ./scripts/infinity-blade-wine.sh:/opt/romm/bin/infinity-blade-wine:ro
      - ./config/webstation/sitecustomize.py:/opt/romm/overrides/sitecustomize.py:ro
      - ./config/webstation/infinity-blade.py:/opt/romm/overrides/infinity_blade.py:ro
      # The desktop icon uses the same shim, so Miis created in an admin
      # desktop session enter the shared database before the next game launch.
      - ./config/webstation/dolphin-emu.desktop:/config/Desktop/dolphin-emu.desktop:ro
    ports:
      # Tailscale Serve publishes this at /streaming over the existing HTTPS
      # hostname; never expose the desktop directly to the LAN.
      - "127.0.0.1:${WEBSTATION_HTTP_PORT:-3010}:3000"
      - "${TAILSCALE_IPV4:?set TAILSCALE_IPV4 in .env}:${SELKIES_WEBRTC_UDP_MUX_PORT:-59000}:${SELKIES_WEBRTC_UDP_MUX_PORT:-59000}/udp"
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 189:* rwm'
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    gpus: all
    # RPCS3 locks large guest-memory regions.  The WebStation default 8 MiB
    # memlock limit causes repeated lock failures and can induce paging stalls.
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: "1gb"

  # Tailnet-only Prometheus endpoint. The proxy keeps Selkies' privileged
  # master token inside Docker while allowing a trusted tailnet scraper to use
  # an ordinary unauthenticated GET /metrics request.
  selkies-metrics:
    # Nginx 1.28-alpine image currently deployed; pinned by immutable digest.
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      romm-webstation:
        condition: service_started
    environment:
      SELKIES_MASTER_TOKEN: ${SELKIES_MASTER_TOKEN:?set SELKIES_MASTER_TOKEN in .env}
    volumes:
      - ./config/selkies-metrics/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${SELKIES_METRICS_HTTP_PORT:-3011}:8080"
