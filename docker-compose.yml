name: emulator

services:
  # Refuses to let the app start when the CIFS share or its marker is absent.
  # This is intentionally a one-shot dependency, not an optional health hint.
  mount-guard:
    image: alpine:3.22
    restart: "no"
    environment:
      GAMES_MOUNT: ${GAMES_MOUNT:?set GAMES_MOUNT in .env}
      ROM_LIBRARY_PATH: ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}
      ROMM_ASSETS_PATH: ${ROMM_ASSETS_PATH:?set ROMM_ASSETS_PATH in .env}
      NAS_SERVER: ${NAS_SERVER:?set NAS_SERVER in .env}
      NAS_SHARE: ${NAS_SHARE:?set NAS_SHARE in .env}
      NAS_MARKER: ${NAS_MARKER:-.emulator-nas-marker}
    volumes:
      - ${GAMES_MOUNT:?set GAMES_MOUNT in .env}:${GAMES_MOUNT}:ro
      - ./scripts/mount-check.sh:/usr/local/bin/mount-check:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/mount-check"]

  romm-db:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
    volumes:
      - ${APP_DATA_PATH:?set APP_DATA_PATH in .env}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  romm:
    image: ${ROMM_IMAGE:-rommapp/romm:latest}
    restart: unless-stopped
    depends_on:
      mount-guard:
        condition: service_completed_successfully
      romm-db:
        condition: service_healthy
    environment:
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY:?set ROMM_AUTH_SECRET_KEY in .env}
      ROMM_BASE_URL: ${ROMM_BASE_URL:?set ROMM_BASE_URL in .env}
      HASHEOUS_API_ENABLED: "true"
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD:-}
      RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      STREAMING_BROKER_SECRET: ${STREAMING_BROKER_SECRET:?set STREAMING_BROKER_SECRET in .env}
      STREAMING_LAUNCH_TIMEOUT: ${STREAMING_LAUNCH_TIMEOUT:-600}
      STREAMING_SAVE_TIMEOUT: ${STREAMING_SAVE_TIMEOUT:-120}
      STREAMING_STATE_HISTORY_LIMIT: ${STREAMING_STATE_HISTORY_LIMIT:-50}
    volumes:
      # Keep the NAS share itself as the bind source, exposed at RomM's
      # built-in Structure A path: /romm/library/roms/{platform}/{game}.
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}:/romm/library/roms:ro
      - ${ROMM_ASSETS_PATH:?set ROMM_ASSETS_PATH in .env}:/romm/assets
      - ${APP_DATA_PATH:?set APP_DATA_PATH in .env}/resources:/romm/resources
      - ${APP_DATA_PATH:?set APP_DATA_PATH in .env}/redis:/redis-data
      - ./config:/romm/config:ro
    ports:
      # Only the local Tailscale Serve proxy may reach RomM; no LAN/public bind.
      - "127.0.0.1:${ROMM_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Native-emulator streaming for RomM. The container includes Selkies,
  # romm-broker, and the supported emulators; it is not a replacement for
  # RomM's existing EmulatorJS player.
  romm-webstation:
    image: ${WEBSTATION_IMAGE:-lscr.io/linuxserver/webstation:romm}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mount-guard:
        condition: service_completed_successfully
    environment:
      PUID: ${WEBSTATION_PUID:-1000}
      PGID: ${WEBSTATION_PGID:-1000}
      TZ: ${TZ:-America/New_York}
      SUBFOLDER: /streaming/
      BROKER_SECRET: ${STREAMING_BROKER_SECRET:?set STREAMING_BROKER_SECRET in .env}
      AUTO_GPU: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      # Load the small RPCS3 installed-title redirect before the broker starts.
      PYTHONPATH: /config/overrides
      # Keep xemu's mutable console configuration and HDD image in the
      # persistent Webstation volume, rather than an image-local default.
      XEMU_TOML: /config/xemu/xemu.toml
      XEMU_HDD_IMAGE: /config/xemu/xbox_hdd.qcow2
    volumes:
      # Persist emulator configuration, firmware, save staging and broker data.
      - ${WEBSTATION_CONFIG_PATH:?set WEBSTATION_CONFIG_PATH in .env}:/config
      - ./config/webstation-overrides:/config/overrides:ro
      # Match RomM's existing library path exactly. Game data remains read-only.
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}:/romm/library/roms:ro
      # RPCS3 needs its game root writable for locks and game-data saves, but
      # installed digital titles must appear as direct children of that root.
      # Mount each verified title read-only; this retains one canonical NAS
      # copy without making RPCS3's mutable game directory read-only.
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BCUS98103:/config/.config/rpcs3/dev_hdd0/game/BCUS98103:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BCUS98123:/config/.config/rpcs3/dev_hdd0/game/BCUS98123:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLES80608:/config/.config/rpcs3/dev_hdd0/game/BLES80608:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30089:/config/.config/rpcs3/dev_hdd0/game/BLUS30089:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30244:/config/.config/rpcs3/dev_hdd0/game/BLUS30244:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30377:/config/.config/rpcs3/dev_hdd0/game/BLUS30377:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30464:/config/.config/rpcs3/dev_hdd0/game/BLUS30464:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30501:/config/.config/rpcs3/dev_hdd0/game/BLUS30501:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30537:/config/.config/rpcs3/dev_hdd0/game/BLUS30537:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30540:/config/.config/rpcs3/dev_hdd0/game/BLUS30540:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30546:/config/.config/rpcs3/dev_hdd0/game/BLUS30546:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30566:/config/.config/rpcs3/dev_hdd0/game/BLUS30566:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30591:/config/.config/rpcs3/dev_hdd0/game/BLUS30591:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30650:/config/.config/rpcs3/dev_hdd0/game/BLUS30650:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30719:/config/.config/rpcs3/dev_hdd0/game/BLUS30719:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30762:/config/.config/rpcs3/dev_hdd0/game/BLUS30762:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30791:/config/.config/rpcs3/dev_hdd0/game/BLUS30791:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30838:/config/.config/rpcs3/dev_hdd0/game/BLUS30838:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30973:/config/.config/rpcs3/dev_hdd0/game/BLUS30973:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS30991:/config/.config/rpcs3/dev_hdd0/game/BLUS30991:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS31003:/config/.config/rpcs3/dev_hdd0/game/BLUS31003:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS31011:/config/.config/rpcs3/dev_hdd0/game/BLUS31011:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS31159:/config/.config/rpcs3/dev_hdd0/game/BLUS31159:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS31178:/config/.config/rpcs3/dev_hdd0/game/BLUS31178:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS31270:/config/.config/rpcs3/dev_hdd0/game/BLUS31270:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS31436:/config/.config/rpcs3/dev_hdd0/game/BLUS31436:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/BLUS31466:/config/.config/rpcs3/dev_hdd0/game/BLUS31466:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/NP0APOLLO:/config/.config/rpcs3/dev_hdd0/game/NP0APOLLO:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/NPIA00005:/config/.config/rpcs3/dev_hdd0/game/NPIA00005:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/NPIA00025:/config/.config/rpcs3/dev_hdd0/game/NPIA00025:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/NPIA09002:/config/.config/rpcs3/dev_hdd0/game/NPIA09002:ro
      - ${ROM_LIBRARY_PATH:?set ROM_LIBRARY_PATH in .env}/PS3/digital_games/NPUA30073:/config/.config/rpcs3/dev_hdd0/game/NPUA30073:ro
    ports:
      # Tailscale Serve publishes this at /streaming over the existing HTTPS
      # hostname; never expose the desktop directly to the LAN.
      - "127.0.0.1:${WEBSTATION_HTTP_PORT:-3010}:3000"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    gpus: all
    shm_size: "1gb"
