# RomM configuration. Everything not listed inherits RomM's defaults.
# Existing ROM files are read only; scans calculate hashes for reliable matching.

filesystem:
  skip_hash_calculation: false
  structure:
    # Most platforms are direct children of roms/{platform}. PS3 keeps
    # different source categories (digital, disc, licenses) one level above
    # its actual title directories.
    default: "roms/{platform}/{game}"
    ps3: "roms/{platform}/{category}/{game}"

# Keep archives and filesystem sidecars out of the catalogue. ROM files remain
# untouched on the NAS; these rules only affect what RomM indexes.
exclude:
  roms:
    single_file:
      extensions:
        - zip
      names:
        - "._*"
    multi_file:
      names:
        - zips
        # PS3 `CATEGORY=GD` folders are installed disc-game data/updates, not
        # independently bootable games. They remain on the NAS for RPCS3 to
        # use with their matching disc dump, but are never offered as RomM
        # launch targets.
        - BCUS98103
        - BCUS98123
        - BCUS98123DATA2
        - BLUS30089
        - BLUS30244
        - BLUS30377
        - BLUS30464
        - BLUS30464_INSTALL
        - BLUS30501
        - BLUS30501-GD
        - BLUS30537
        - BLUS30540
        - BLUS30546
        - BLUS30566
        - BLUS30591
        - BLUS30650
        - BLUS30650INSTALL
        - BLUS30719
        - BLUS30738
        - BLUS30762
        - BLUS30791
        - BLUS30838
        - BLUS30973
        - BLUS30991
        - BLUS31003
        - BLUS31011
        - BLUS31159
        - BLUS31176
        - BLUS31178
        - BLUS31270
        - BLUS31428
        - BLUS31436
        - BLUS31466
        - NPIA00005DATA
        # Additional legacy/install folders with neither a boot executable nor
        # title metadata. Keeping them out of the scan prevents a stream
        # action that would inevitably return "no bootable file found".
        - far_cry_3
        - NPUA80665
        - NPUB30035
        - NPUB30065
        - NPUB30643
        - NPUB30702
        - NPUB30742
        - NPUB31254
        - NPUB31257
        - NPUP00030
        - NPUP00030CACHE
        - NPUP10028
      parts:
        names:
          - "._*"
        extensions:
          - zip

# Map the existing library's folder names without moving or renaming ROM files.
system:
  platforms:
    GBA: gba
    N64: n64
    NDS: nds
    NES: nes
    GameCube: ngc
    PS2: ps2
    PS3: ps3
    PSX: psx
    Wii: wii
    Xbox: xbox

scan:
  priority:
    region:
      - us
      - eu
      - wor
      - jp
    region_mode: prefer_rom_tags

emulatorjs:
  # Upload each in-game SRAM/flash/EEPROM write rather than waiting for Save & Quit.
  auto_save_sync: true
  default_cores:
    gb: gambatte
    gbc: gambatte
    gba: mgba
    nes: nestopia
    snes: snes9x
    n64: mupen64plus_next
    sms: genesis_plus_gx
    gamegear: genesis_plus_gx
    genesis: genesis_plus_gx
  settings:
    snes9x:
      snes9x_region: ntsc

# Native-emulator sessions run in the single Webstation container. Browser
# play remains available on platforms supported by EmulatorJS.
streaming:
  enabled: true
  containers:
    - protocol: webstation
      # The browser-facing Selkies UI is proxied below RomM's Tailnet origin.
      # A root URL would load RomM itself in the streaming iframe.
      host: /streaming
      subfolder: /streaming
      broker_host: http://romm-webstation:3000
      library_path: /romm/library
      label: Emulation station
      platforms:
        psx: duckstation
        ps2:
          emulator: pcsx2
          memory_card_sync: true
        ps3: rpcs3
        ngc:
          emulator: dolphin
          memory_card_sync: true
        wii: dolphin
        xbox: xemu
